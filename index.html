<style>
:root{
  --ink:#14233b; --ink2:#52617a; --blue:#2b5ca8; --blue-d:#1f4585; --bg:#edf1f6; --card:#fff; --line:#d3dbe7;
  --ok:#1b7f4e; --ok-bg:#e2f4ea; --warn:#9a6508; --warn-bg:#fdf1d3; --bad:#b3261e; --bad-bg:#fbe3e1;
  --mute:#6b7689; --mute-bg:#e9edf3; --wifi:#6b3fa8; --wifi-bg:#efe6fa; --cable:#0c6470; --cable-bg:#dcf1f3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7fa6e6;outline-offset:2px}
header{background:#16233a;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
header h1 small{display:block;font-weight:400;font-size:12.5px;opacity:.85}
header .who{font-size:12.5px;text-align:right;line-height:1.3}
header .who button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-size:12.5px}
main{max-width:920px;margin:0 auto;padding:14px 12px}
.banner{background:var(--warn-bg);color:#5c3d00;border:1px solid #e8cf8c;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
#aviso{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;
  background:var(--ink);color:#fff;padding:11px 14px;border-radius:8px;font-size:14.5px;z-index:60;display:none;box-shadow:0 6px 20px rgba(20,35,59,.35)}
#aviso.err{background:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
nav button{flex:1;max-width:180px;background:none;border:0;border-top:3px solid transparent;padding:12px 4px 13px;font-size:13.5px;color:var(--ink2);font-weight:600}
nav button[aria-current="true"]{color:var(--blue);border-top-color:var(--blue)}
h2{font-size:17px;margin:18px 0 8px}
h2:first-child{margin-top:4px}
.sub{color:var(--ink2);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 2px;font-size:16px}
.bar{height:10px;background:var(--mute-bg);border-radius:5px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:26px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.list{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list li:last-child{border-bottom:0}
.list .nm{flex:1;min-width:0}
.list .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .nm span{color:var(--ink2);font-size:13px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--blue-d)}
.btn.sm{padding:7px 10px;font-size:13.5px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost:hover{background:#eef3fb}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.filters{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr;gap:8px;margin-bottom:10px}
@media(max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%;background:#fff;border:1px solid #b9c4d4;border-radius:7px;padding:9px 10px;min-height:42px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.inst{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mute);border-radius:10px;padding:12px 14px;margin-bottom:9px;
  display:block;width:100%;text-align:left}
.inst.wifi{border-left-color:var(--wifi)} .inst.red{border-left-color:var(--cable)}
.inst:hover{background:#f7f9fc}
.inst .top{display:flex;gap:10px;align-items:flex-start}
.inst .top b{flex:1;font-size:15.5px}
.inst .meta{color:var(--ink2);font-size:13.5px;margin:2px 0 9px}
.tag{display:inline-block;border-radius:5px;padding:2px 8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tag.wifi{background:var(--wifi-bg);color:var(--wifi)} .tag.red{background:var(--cable-bg);color:var(--cable)} .tag.nd{background:var(--mute-bg);color:var(--mute)}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:600;background:var(--mute-bg);color:var(--mute);border:1px solid transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.inc{background:var(--cable-bg);color:var(--cable)} .pill.now{background:#fff;color:var(--blue);border-color:var(--blue)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:12.5px}
.empty{text-align:center;color:var(--ink2);padding:26px 10px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--ink2);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.overlay{position:fixed;inset:0;background:rgba(20,35,59,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
@media(min-width:700px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{border-radius:14px}}
.modal .mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.modal .mh h2{flex:1;margin:0;font-size:18px}
.x{background:var(--mute-bg);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;line-height:1}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:14.5px}
dt{color:var(--ink2)} dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.claves{background:#f4f6fa;border:1px dashed #a9b6c9;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid #b9c4d4;border-radius:7px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;border-right:1px solid #b9c4d4;padding:10px 6px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button.alert[aria-pressed="true"]{background:var(--warn)}
.chk{display:grid;grid-template-columns:1fr 210px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
@media(max-width:520px){.chk{grid-template-columns:1fr}}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions .sp{flex:1}
.login{max-width:420px;margin:40px auto;text-align:center}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .16s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}}}
</style>
</head>

<script>
/* ============================================================
   CONFIGURACIÓN
   Con FIREBASE_CONFIG = null la app funciona en MODO PRUEBA:
   los datos se guardan solo en este navegador. No meter claves reales.
   Para ponerla en producción: rellenar las tres constantes.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDqcZncea3Wo9HE4x3KZuVt2Veha3CPCdE",
  authDomain: "dhs-camaras.firebaseapp.com",
  projectId: "dhs-camaras",
  storageBucket: "dhs-camaras.firebasestorage.app",
  messagingSenderId: "827499700905",
  appId: "1:827499700905:web:c6487b4ef23a861e86ffb8"
};
const GOOGLE_CLIENT_ID = "827499700905-3a01dotf0dtl007rmfhoqepl1771r89a.apps.googleusercontent.com";             // ...apps.googleusercontent.com (cliente OAuth web del proyecto)
const ADMIN_EMAIL = "dhsvideoporters@gmail.com"; // administrador principal (debe coincidir con firestore.rules)

const COL = {insts:"dhs_instalaciones", eco:"dhs_economia", revs:"dhs_revisiones", users:"dhs_usuarios"};
const LS_KEY = "dhs_camaras_prueba_v1";

/* Puntos del acta de mantenimiento de DHS (los 7 del documento) */
const CHECKS = [
  {k:"limpieza",  t:"Limpieza de cámaras",      o:["Realizado","No procede"]},
  {k:"grabacion", t:"Revisión de grabación",    o:["Correcto","Incidencia"]},
  {k:"retencion", t:"Retención 30 días",        o:["Correcto","Incidencia"]},
  {k:"fechahora", t:"Fecha y hora",             o:["Ajustada","Incidencia"]},
  {k:"disco",     t:"Disco duro / PoE",         o:["Correcto","Incidencia"]},
  {k:"angulos",   t:"Ángulos / privacidad",     o:["Correcto","Ajustado"]},
  {k:"carteles",  t:"Carteles videovigilancia", o:["Correcto","Renovar"]}
];
const ALERTA = ["Incidencia","Renovar"];
const PER = {verano:"Verano", invierno:"Invierno"};

/* Sin datos de clientes en este archivo: se cargan desde Ajustes con un archivo de copia */
const SEED = [];
function seedData(){
  const insts={}, eco={};
  SEED.forEach((r,i)=>{
    const id="i"+String(i+1).padStart(3,"0");
    insts[id]={comunidad:r[0],direccion:"",ciudad:r[3],admin:r[4],telefono:r[1],contacto:r[2],camaras:null,conexion:"",claves:"",notas:""};
    eco[id]={precio:r[5],cuenta:"",cobros:r[6]?{"2026":{cobrado:false,fecha:"",nota:r[6]}}:{}};
  });
  return {insts,eco};
}

/* ---------------- Estado ---------------- */
const HOY = new Date();
const S = {insts:{},eco:{},revs:{},users:{}};
const UI = {tab:"resumen", year:HOY.getFullYear(), q:"", fAdmin:"", fCon:"", fEst:"", role:null, user:null, ready:false, demo:!FIREBASE_CONFIG};
let fdb=null;

const $ = s=>document.querySelector(s);
const esc = v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n=>(n==null||n==="")?"—":Number(n).toLocaleString("es-ES",{maximumFractionDigits:2})+" €";
const isAdmin = ()=>UI.role==="admin";
const iso = d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fFecha = s=>{ if(!s) return ""; const p=s.split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s; };
const revId = (id,y,p)=>id+"_"+y+"_"+p;
const perActual = ()=>HOY.getMonth()<6?"verano":"invierno";

let avisoT;
function aviso(msg,err){ const a=$("#aviso"); a.textContent=msg; a.className=err?"err":""; a.style.display="block"; clearTimeout(avisoT); avisoT=setTimeout(()=>a.style.display="none", err?7000:2600); }

/* ---------------- Guardado (prueba local / Firestore) ---------------- */
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function lsLoad(){ try{ const t=localStorage.getItem(LS_KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
async function dbSet(col,id,data){
  if(UI.demo){ S[col][id]=data; lsSave(); return; }
  await fdb.collection(COL[col]).doc(id).set(data);
}
async function dbDel(col,id){
  if(UI.demo){ delete S[col][id]; lsSave(); return; }
  await fdb.collection(COL[col]).doc(id).delete();
}
async function guardar(fn,okMsg){
  try{ await fn(); if(okMsg) aviso(okMsg); render(); return true; }
  catch(e){ console.error(e); aviso("No se ha guardado: "+(e.code==="permission-denied"?"tu usuario no tiene permiso para este cambio.":(e.message||e)),true); return false; }
}

/* ---------------- Estados de revisión y cobro ---------------- */
function estRev(id,y,p){
  const r=S.revs[revId(id,y,p)];
  if(r&&r.hecha){ const inc=CHECKS.some(c=>ALERTA.includes((r.checks||{})[c.k])); return inc?{c:"warn",t:"hecha, con incidencia",done:true}:{c:"ok",t:"hecha",done:true}; }
  const ini=new Date(y,p==="verano"?2:9,1), fin=new Date(y,p==="verano"?3:10,30,23,59);
  if(HOY>fin) return {c:"bad",t:"atrasada"};
  if(r) return {c:"now",t:"a medias"};
  if(HOY>=ini) return {c:"now",t:"toca ahora"};
  return {c:"",t:"pendiente"};
}
function estCobro(id,y){
  const e=S.eco[id]||{}, c=(e.cobros||{})[y]||{};
  if(c.cobrado) return {c:"ok",t:"cobrado",done:true};
  if(esIncluido(c)) return {c:"inc",t:"incluido 1er año",done:true,inc:true};
  if(e.precio==null||e.precio==="") return {c:"",t:"sin precio"};
  if(y>HOY.getFullYear()) return {c:"",t:"pendiente"};
  if(y<HOY.getFullYear()||HOY.getMonth()>0) return {c:"bad",t:"sin cobrar"};
  return {c:"now",t:"toca cobrar"};
}
/* Primer año tras la instalación: el mantenimiento va incluido y no se cobra */
function esIncluido(c){ return !!c && (c.incluido===true || /^1\s*a[ñn]o$/i.test((c.nota||"").trim())); }
function strip(id,y){
  let h='<div class="strip">';
  if(isAdmin()){ const c=estCobro(id,y); h+=`<span class="pill ${c.c}">Cobro ${y}: ${c.t}</span>`; }
  ["verano","invierno"].forEach(p=>{ const s=estRev(id,y,p); h+=`<span class="pill ${s.c}">${PER[p]}: ${s.t}</span>`; });
  return h+"</div>";
}
function tagCon(c){ return c==="wifi"?'<span class="tag wifi">WiFi</span>':c==="red"?'<span class="tag red">Red (cable)</span>':'<span class="tag nd">Conexión sin indicar</span>'; }
function instsOrdenadas(){ return Object.entries(S.insts).map(([id,v])=>({id,...v})).sort((a,b)=>(a.admin||"").localeCompare(b.admin||"","es")||(a.comunidad||"").localeCompare(b.comunidad||"","es")); }
function admins(){ return [...new Set(Object.values(S.insts).map(i=>(i.admin||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es")); }
function yearOpts(){ const y0=HOY.getFullYear(); return [y0-1,y0,y0+1].map(y=>`<option value="${y}" ${y===UI.year?"selected":""}>${y}</option>`).join(""); }

/* ---------------- Pantallas ---------------- */
function render(){
  const app=$("#app"), nav=$("#nav");
  $("#who").innerHTML = UI.demo
    ? `Modo prueba<br><button data-act="rol">Ver como ${isAdmin()?"técnico":"administrador"}</button>`
    : (UI.user?`${esc(UI.user.displayName||UI.user.email)} (${isAdmin()?"administrador":"técnico"})<br><button data-act="salir">Cerrar sesión</button>`:"");
  if(!UI.ready){ nav.hidden=true; return; }
  const tabs=[["resumen","Resumen"],["insts","Instalaciones"]]; if(isAdmin()) tabs.push(["cobros","Cobros"],["ajustes","Ajustes"]);
  if(!tabs.some(t=>t[0]===UI.tab)) UI.tab="resumen";
  nav.hidden=false;
  nav.innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" aria-current="${UI.tab===t[0]}">${t[1]}</button>`).join("");
  let h = UI.demo?`<div class="banner"><b>Modo prueba.</b> Lo que apuntes se guarda solo en este navegador y es para ver cómo funciona. No metas claves reales de cámaras hasta que la app esté publicada con inicio de sesión.</div>`:"";
  if(!UI.demo && isAdmin()){ let u=0; try{ u=Number(localStorage.getItem("dhs_cam_ultima_copia"))||0; }catch(e){} const d=u?Math.floor((Date.now()-u)/864e5):null; if(d===null||d>=30) h+=`<div class="banner"><b>Toca hacer la copia de seguridad mensual.</b> ${d===null?"En este dispositivo todavía no se ha hecho ninguna.":"La última fue hace "+d+" días."} <button class="btn sm" data-act="backup" style="margin-left:6px">Descargar copia</button></div>`; }
  h += ({resumen:vResumen,insts:vInsts,cobros:vCobros,ajustes:vAjustes})[UI.tab]();
  app.innerHTML=h;

function vResumen(){
  const L=instsOrdenadas(), y=HOY.getFullYear(), p=perActual();
  if(!L.length) return vVacio();
  const hechas=L.filter(i=>estRev(i.id,y,p).done), pend=L.filter(i=>!estRev(i.id,y,p).done);
  const cam=L.reduce((s,i)=>s+(Number(i.camaras)||0),0), nW=L.filter(i=>i.conexion==="wifi").length, nR=L.filter(i=>i.conexion==="red").length;
  let h=`<div class="panel"><h3>Revisión de ${PER[p].toLowerCase()} ${y}</h3>
    <div class="sub">Dos revisiones al año, en los cambios de hora (marzo y octubre).</div>
    <div class="bar"><i style="width:${L.length?hechas.length/L.length*100:0}%"></i></div>
    <div><span class="big">${hechas.length}</span> de ${L.length} hechas</div>`;
  if(pend.length){ h+=`<ul class="list">`+pend.map(i=>{const s=estRev(i.id,y,p);return `<li><div class="nm"><b>${esc(i.comunidad)}</b><span>${esc([i.ciudad,i.admin].filter(Boolean).join(", "))}</span></div><span class="pill ${s.c}">${s.t}</span><button class="btn sm" data-act="rev" data-id="${i.id}" data-y="${y}" data-p="${p}">Revisar</button></li>`}).join("")+`</ul>`; }
  else h+=`<p class="sub">Todas las revisiones de este periodo están hechas.</p>`;
  h+=`</div>`;
  if(isAdmin()){
    const conPrecio=L.filter(i=>S.eco[i.id]&&S.eco[i.id].precio!=null&&S.eco[i.id].precio!=="");
    const nInc=L.filter(i=>estCobro(i.id,y).inc).length;
    const conP=conPrecio.filter(i=>!estCobro(i.id,y).inc);
    const total=conP.reduce((s,i)=>s+Number(S.eco[i.id].precio),0);
    const cob=conP.filter(i=>estCobro(i.id,y).done), cobrado=cob.reduce((s,i)=>s+Number(S.eco[i.id].precio),0);
    const sinCobrar=conP.filter(i=>!estCobro(i.id,y).done), sinPrecio=L.length-conPrecio.length;
    h+=`<div class="panel"><h3>Cobro anual ${y}</h3><div class="sub">Se factura una vez al año, en enero.</div>
      <div class="bar"><i style="width:${total?cobrado/total*100:0}%"></i></div>
      <div><span class="big">${eur(cobrado)}</span> cobrados de ${eur(total)}</div>
      <p class="sub" style="margin:6px 0 0">${sinCobrar.length} sin cobrar (${eur(total-cobrado)})${sinPrecio?`, y ${sinPrecio} instalaciones sin precio puesto`:""}.${nInc?` ${nInc} no se cobran este año por ser su primer año.`:""}</p>
      ${sinCobrar.length?`<ul class="list">`+sinCobrar.map(i=>`<li><div class="nm"><b>${esc(i.comunidad)}</b><span>${esc(i.admin||"")}</span></div><span>${eur(S.eco[i.id].precio)}</span><button class="btn sm ghost" data-act="cobrar" data-id="${i.id}" data-y="${y}">Marcar cobrado</button></li>`).join("")+`</ul>`:""}
    </div>`;
    const f={cam:L.filter(i=>!i.camaras).length, con:L.filter(i=>!i.conexion).length, cla:L.filter(i=>!(i.claves||"").trim()).length, pre:sinPrecio};
    if(f.cam+f.con+f.cla+f.pre) h+=`<div class="panel"><h3>Datos por completar</h3><div class="sub">Abre cada instalación y pulsa Editar.</div>
      <dl><dt>Sin número de cámaras</dt><dd>${f.cam}</dd><dt>Sin tipo de conexión</dt><dd>${f.con}</dd><dt>Sin claves</dt><dd>${f.cla}</dd><dt>Sin precio</dt><dd>${f.pre}</dd></dl></div>`;
  }
  h+=`<div class="panel"><h3>Instalaciones en mantenimiento</h3><dl><dt>Comunidades</dt><dd>${L.length}</dd><dt>Cámaras</dt><dd>${cam||"—"}</dd><dt>Por WiFi</dt><dd>${nW}</dd><dt>Por red (cable)</dt><dd>${nR}</dd><dt>Sin indicar</dt><dd>${L.length-nW-nR}</dd></dl></div>`;
  return h;
}

function vVacio(){
  return `<div class="panel empty"><p>Todavía no hay instalaciones.</p>${isAdmin()?`<div class="row" style="justify-content:center"><button class="btn" data-act="importar">Cargar datos desde un archivo</button><button class="btn ghost" data-act="nueva">Añadir una a mano</button></div>`:`<p class="sub">El administrador tiene que darlas de alta.</p>`}</div>`;
}

function vInsts(){
  const all=instsOrdenadas(); if(!all.length) return vVacio();
  const y=UI.year, q=UI.q.trim().toLowerCase(), p=perActual();
  const L=all.filter(i=>{
    if(q && !([i.comunidad,i.direccion,i.ciudad,i.admin,i.contacto].join(" ").toLowerCase().includes(q))) return false;
    if(UI.fAdmin && (i.admin||"")!==UI.fAdmin) return false;
    if(UI.fCon && (UI.fCon==="nd"?i.conexion:i.conexion!==UI.fCon)) return false;
    if(UI.fEst==="rev" && estRev(i.id,y,p).done) return false;
    if(UI.fEst==="cob" && estCobro(i.id,y).done) return false;
    return true;
  });
  let h=`<div class="filters">
    <input type="search" id="fq" placeholder="Buscar comunidad, calle, ciudad…" value="${esc(UI.q)}" aria-label="Buscar">
    <select id="fAdmin" aria-label="Administrador de fincas"><option value="">Todos los administradores</option>${admins().map(a=>`<option ${a===UI.fAdmin?"selected":""}>${esc(a)}</option>`).join("")}</select>
    <select id="fCon" aria-label="Conexión"><option value="">WiFi y red</option><option value="wifi" ${UI.fCon==="wifi"?"selected":""}>Solo WiFi</option><option value="red" ${UI.fCon==="red"?"selected":""}>Solo red (cable)</option><option value="nd" ${UI.fCon==="nd"?"selected":""}>Sin indicar</option></select>
    <select id="fEst" aria-label="Estado"><option value="">Todas</option><option value="rev" ${UI.fEst==="rev"?"selected":""}>Revisión pendiente</option>${isAdmin()?`<option value="cob" ${UI.fEst==="cob"?"selected":""}>Sin cobrar</option>`:""}</select>
  </div>
  <div class="row" style="margin-bottom:10px"><span class="sub">${L.length} de ${all.length} instalaciones, año</span><select id="fYear" style="width:auto" aria-label="Año">${yearOpts()}</select><span style="flex:1"></span>${isAdmin()?`<button class="btn sm" data-act="nueva">Nueva instalación</button>`:""}</div>`;
  if(!L.length) return h+`<div class="panel empty">Ninguna instalación coincide con los filtros.</div>`;
  h+=L.map(i=>{
    const e=S.eco[i.id]||{};
    const meta=[i.direccion,i.ciudad,i.admin?("Adm. "+i.admin):"",i.camaras?(i.camaras+" cámaras"):"",isAdmin()&&e.precio!=null&&e.precio!==""?eur(e.precio)+"/año":""].filter(Boolean).join(" | ");
    return `<button class="inst ${esc(i.conexion||"")}" data-act="ver" data-id="${i.id}"><div class="top"><b>${esc(i.comunidad)}</b>${tagCon(i.conexion)}</div><div class="meta">${esc(meta)}</div>${strip(i.id,y)}</button>`;
  }).join("");
  return h;
}

function vCobros(){
  const L=instsOrdenadas(); if(!L.length) return vVacio();
  const y=UI.year; let tot=0, cob=0;
  const rows=L.map(i=>{
    const e=S.eco[i.id]||{}, c=(e.cobros||{})[y]||{}, tiene=e.precio!=null&&e.precio!=="";
    const st=estCobro(i.id,y);
    if(tiene&&!st.inc){ tot+=Number(e.precio); if(c.cobrado) cob+=Number(e.precio); }
    return `<tr><td><b>${esc(i.comunidad)}</b><div class="sub">${esc(i.admin||"")}${c.nota&&!/^1\s*a[ñn]o$/i.test(c.nota.trim())?` | Nota: ${esc(c.nota)}`:""}</div></td>
      <td class="num">${eur(e.precio)}</td>
      <td>${c.cobrado?`<span class="pill ok">Cobrado ${esc(fFecha(c.fecha))}</span>`:`<span class="pill ${st.c}">${st.inc?"Incluido 1er año":st.t}</span>`}</td>
      <td class="num">${c.cobrado?`<button class="btn sm ghost" data-act="descobrar" data-id="${i.id}" data-y="${y}">Deshacer</button>`:st.inc?`<button class="btn sm ghost" data-act="noIncluir" data-id="${i.id}" data-y="${y}">Quitar incluido</button>`:`<button class="btn sm" data-act="cobrar" data-id="${i.id}" data-y="${y}">Marcar cobrado</button> <button class="btn sm ghost" data-act="incluir" data-id="${i.id}" data-y="${y}">1er año incluido</button>`} <button class="btn sm ghost" data-act="notaCobro" data-id="${i.id}" data-y="${y}">Nota</button></td></tr>`;
  }).join("");
  return `<div class="row" style="margin-bottom:10px"><h2 style="margin:0;flex:1">Cobro anual</h2><select id="fYear" style="width:auto" aria-label="Año">${yearOpts()}</select></div>
  <div class="panel"><div><span class="big">${eur(cob)}</span> cobrados de ${eur(tot)}</div><div class="bar"><i style="width:${tot?cob/tot*100:0}%"></i></div><div class="sub">Pendiente: ${eur(tot-cob)}. El cobro de cada año se hace en enero. El primer año tras la instalación va incluido y no cuenta en estos totales.</div></div>
  <div class="panel tw"><table><thead><tr><th>Comunidad</th><th class="num">Precio/año</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

  abrir(`<div class="mh"><h2>Acta de mantenimiento<br><span class="sub" style="font-weight:400">${esc(i.comunidad)}, ${PER[p].toLowerCase()} ${y}</span></h2><button class="x" data-act="cerrar" aria-label="Cerrar">×</button></div>

  <h2>Revisión realizada</h2>
  <div id="rChk">${CHECKS.map((c,n)=>`<div class="chk"><span>${n+1}. ${c.t}</span><div class="seg" data-k="${c.k}" data-v="${esc((r.checks||{})[c.k]||"")}">${c.o.map(o=>`<button type="button" data-seg="${o}" class="${ALERTA.includes(o)?"alert":""}" aria-pressed="${(r.checks||{})[c.k]===o}">${o}</button>`).join("")}</div></div>`).join("")}</div>
  <label for="rObs">Observaciones</label><textarea id="rObs">${esc(r.obs)}</textarea>
  <p class="sub">La revisión queda como hecha cuando los 7 puntos están marcados.</p>
  <div class="actions"><button class="btn" data-act="guardarRev" data-id="${id}" data-y="${y}" data-p="${p}">Guardar revisión</button><button class="btn ghost" data-act="ver" data-id="${id}">Volver</button><span class="sp"></span>${isAdmin()&&S.revs[revId(id,y,p)]?`<button class="btn danger" data-act="borrarRev" data-id="${id}" data-y="${y}" data-p="${p}">Borrar acta</button>`:""}</div>`);
}

/* ---------------- Acciones ---------------- */
async function setCobro(id,y,patch){
  const e=JSON.parse(JSON.stringify(S.eco[id]||{precio:null,cuenta:"",cobros:{}})); e.cobros=e.cobros||{};
  e.cobros[y]=Object.assign({cobrado:false,fecha:"",nota:"",incluido:false},e.cobros[y]||{},patch);
  if(patch.cobrado) e.cobros[y].incluido=false;
  await dbSet("eco",id,e);
}
const ACT={
  cerrar(){cerrar()},
  rol(){ UI.role=isAdmin()?"tecnico":"admin"; cerrar(); render(); },
  salir(){ firebase.auth().signOut(); },
  ver(d){ mVer(d.id) },
  nueva(){ mEditar("") },
  editar(d){ mEditar(d.id) },
  rev(d){ mRev(d.id,Number(d.y),d.p) },
  verClaves(d,el){ const c=$("#clv"); const on=c.dataset.on==="1"; c.textContent=on?"••••••••••••":S.insts[d.id].claves; c.dataset.on=on?"0":"1"; el.textContent=on?"Mostrar":"Ocultar"; },
  async copiarClaves(d){ try{ await navigator.clipboard.writeText(S.insts[d.id].claves); aviso("Claves copiadas"); }catch(e){ aviso("No se ha podido copiar. Pulsa Mostrar y cópialas a mano.",true); } },
  async guardarInst(d){
    const com=$("#eCom").value.trim(); if(!com){ aviso("Pon el nombre de la comunidad.",true); return; }
    const id=d.id||("i"+Date.now().toString(36));
    const cam=$("#eCam").value.trim(), pre=$("#ePre").value.trim();
    const inst={comunidad:com,direccion:$("#eDir").value.trim(),ciudad:$("#eCiu").value.trim(),admin:$("#eAdm").value.trim(),contacto:$("#eCon").value.trim(),telefono:$("#eTel").value.trim(),
      camaras:cam===""?null:Number(cam),conexion:$("#eSeg").dataset.v,claves:$("#eCla").value,notas:$("#eNot").value.trim()};
    const eco=Object.assign({cobros:{}},S.eco[id]||{},{precio:pre===""?null:Number(pre),cuenta:$("#eCue").value.trim()});
    if(await guardar(async()=>{ await dbSet("insts",id,inst); await dbSet("eco",id,eco); },"Instalación guardada")){ S.insts[id]=inst; S.eco[id]=eco; mVer(id); }
  },
  async borrar(d){
    if(!confirm("¿Dar de baja «"+S.insts[d.id].comunidad+"»? Se borran también sus revisiones y cobros.")) return;
    const revs=Object.keys(S.revs).filter(k=>S.revs[k].instId===d.id);
    if(await guardar(async()=>{ for(const k of revs) await dbDel("revs",k); await dbDel("eco",d.id); await dbDel("insts",d.id); },"Instalación dada de baja")) cerrar();
  },
  async guardarRev(d){
    const checks={}; document.querySelectorAll("#rChk .seg").forEach(s=>{ if(s.dataset.v) checks[s.dataset.k]=s.dataset.v; });
    const hecha=CHECKS.every(c=>checks[c.k]); const y=Number(d.y);
    const r={instId:d.id,anio:y,periodo:d.p,fecha:$("#rFec").value,tecnico:$("#rTec").value.trim(),checks,obs:$("#rObs").value.trim(),hecha};
    if(hecha&&!r.fecha){ aviso("Pon la fecha del mantenimiento.",true); return; }
    const k=revId(d.id,y,d.p);
    if(await guardar(()=>dbSet("revs",k,r), hecha?"Revisión guardada como hecha":"Guardada a medias: faltan puntos por marcar")){ S.revs[k]=r; mVer(d.id); }
  },
  async borrarRev(d){ if(!confirm("¿Borrar esta acta?")) return; const k=revId(d.id,Number(d.y),d.p); if(await guardar(()=>dbDel("revs",k),"Acta borrada")){ delete S.revs[k]; mVer(d.id); } },
  async cobrar(d){ const e=S.eco[d.id]||{}; if(e.precio==null||e.precio===""){ aviso("Esta instalación no tiene precio. Ponlo antes en Editar.",true); return; }
    if(await guardar(()=>setCobro(d.id,d.y,{cobrado:true,fecha:iso(new Date())}),"Marcado como cobrado") && d.back) mVer(d.id); },
  async descobrar(d){ if(await guardar(()=>setCobro(d.id,d.y,{cobrado:false,fecha:""}),"Cobro deshecho") && d.back) mVer(d.id); },
  async incluir(d){ if(await guardar(()=>setCobro(d.id,d.y,{incluido:true,cobrado:false,fecha:""}),"Marcado como incluido por primer año") && d.back) mVer(d.id); },
  async noIncluir(d){ const c=((S.eco[d.id]||{}).cobros||{})[d.y]||{}; const p={incluido:false}; if(/^1\s*a[ñn]o$/i.test((c.nota||"").trim())) p.nota=""; if(await guardar(()=>setCobro(d.id,d.y,p),"Vuelve a contar como cobro normal") && d.back) mVer(d.id); },
  async notaCobro(d){ const c=((S.eco[d.id]||{}).cobros||{})[d.y]||{}; const n=prompt("Nota para el cobro de "+d.y+":",c.nota||""); if(n===null) return; await guardar(()=>setCobro(d.id,d.y,{nota:n.trim()}),"Nota guardada"); },
  importar(){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f) return;
      let d; try{ d=JSON.parse(await f.text()); }catch(e){ aviso("El archivo no es una copia válida.",true); return; }
      const I=d.instalaciones||{}, E=d.economia||{}, R=d.revisiones||{}, n=Object.keys(I).length;
      if(!n){ aviso("El archivo no trae ninguna instalación.",true); return; }
      if(!confirm("Se van a cargar "+n+" instalaciones y "+Object.keys(R).length+" actas. ¿Continuar?")) return;
      await guardar(async()=>{ for(const id in I){ await dbSet("insts",id,I[id]); await dbSet("eco",id,E[id]||{precio:null,cuenta:"",cobros:{}}); } for(const k in R) await dbSet("revs",k,R[k]); }, n+" instalaciones cargadas");
    };
    inp.click();
  },
  async addUser(){ const em=$("#uEm").value.trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ aviso("Escribe un correo válido.",true); return; } await guardar(()=>dbSet("users",em,{rol:$("#uRol").value}),"Acceso dado a "+em); },
  async delUser(d){ if(confirm("¿Quitar el acceso a "+d.id+"?")) await guardar(()=>dbDel("users",d.id),"Acceso quitado"); },
  async excel(){
    try{
      if(!window.XLSX) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const L=instsOrdenadas(), nom=id=>(S.insts[id]||{}).comunidad||id;
      const h1=L.map(i=>{const e=S.eco[i.id]||{};return {"Comunidad":i.comunidad,"Dirección":i.direccion,"Ciudad":i.ciudad,"Administrador":i.admin,"Persona de contacto":i.contacto,"Teléfono":i.telefono,"Nº cámaras":i.camaras,"Conexión":i.conexion==="wifi"?"WiFi":i.conexion==="red"?"Red":"","PVP mantenimiento":e.precio,"Nº de cuenta":e.cuenta,"Claves":i.claves,"Notas":i.notas};});
      const h2=Object.values(S.revs).sort((a,b)=>(b.anio-a.anio)||nom(a.instId).localeCompare(nom(b.instId),"es")).map(r=>{const o={"Comunidad":nom(r.instId),"Año":r.anio,"Periodo":PER[r.periodo],"Fecha":fFecha(r.fecha),"Técnico":r.tecnico,"Estado":r.hecha?"Hecha":"A medias"};CHECKS.forEach(c=>o[c.t]=(r.checks||{})[c.k]||"");o["Observaciones"]=r.obs;return o;});
      const h3=[];L.forEach(i=>{const e=S.eco[i.id]||{};Object.keys(e.cobros||{}).sort().forEach(y=>{const c=e.cobros[y];h3.push({"Comunidad":i.comunidad,"Administrador":i.admin,"Año":Number(y),"Importe":e.precio,"Cobrado":c.cobrado?"Sí":esIncluido(c)?"Incluido 1er año":"No","Fecha de cobro":fFecha(c.fecha),"Nota":c.nota});});});
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(h1),"Instalaciones");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(h2.length?h2:[{"Comunidad":""}]),"Revisiones");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(h3.length?h3:[{"Comunidad":""}]),"Cobros");
      XLSX.writeFile(wb,"DHS-mantenimientos-camaras-"+iso(new Date())+".xlsx");
      aviso("Excel descargado");
    }catch(e){ console.error(e); aviso("No se ha podido crear el Excel: "+(e.message||e),true); }
  },
  backup(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify({fecha:new Date().toISOString(),instalaciones:S.insts,economia:S.eco,revisiones:S.revs},null,2)],{type:"application/json"})); a.download="dhs-camaras-copia-"+iso(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove(); try{ localStorage.setItem("dhs_cam_ultima_copia",String(Date.now())); }catch(e){} aviso("Copia descargada. Guárdala en la carpeta de DHS."); render(); },
  resetDemo(){ if(!confirm("¿Borrar los datos de prueba de este navegador?")) return; const sd=seedData(); S.insts=sd.insts; S.eco=sd.eco; S.revs={}; lsSave(); aviso("Datos de prueba reiniciados"); render(); }
};

document.addEventListener("click",ev=>{
  const sg=ev.target.closest("[data-seg]");
  if(sg){ const box=sg.parentElement; const same=box.dataset.v===sg.dataset.seg && box.id!=="eSeg"; box.dataset.v=same?"":sg.dataset.seg; box.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", !same&&b===sg)); return; }
  const tb=ev.target.closest("[data-tab]"); if(tb){ UI.tab=tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el=ev.target.closest("[data-act]"); if(el&&ACT[el.dataset.act]){ ACT[el.dataset.act](el.dataset, el); return; }
  if(ev.target.id==="ov") cerrar();
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") cerrar(); });
document.addEventListener("input",ev=>{ if(ev.target.id==="fq"){ UI.q=ev.target.value; const pos=ev.target.selectionStart; render(); const n=$("#fq"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } } });
document.addEventListener("change",ev=>{ const m={fAdmin:"fAdmin",fCon:"fCon",fEst:"fEst"}; if(m[ev.target.id]){ UI[m[ev.target.id]]=ev.target.value; render(); } if(ev.target.id==="fYear"){ UI.year=Number(ev.target.value); render(); } });

/* ---------------- Arranque ---------------- */
function cargarScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }

function iniciarDemo(){
  const g=lsLoad();
  if(g&&g.insts){ Object.assign(S,{insts:g.insts,eco:g.eco||{},revs:g.revs||{},users:{}}); }
  else { const sd=seedData(); S.insts=sd.insts; S.eco=sd.eco; }
  UI.role="admin"; UI.ready=true; render();
}

async function iniciarFirebase(){
  const v="10.12.2", b="https://www.gstatic.com/firebasejs/"+v+"/";
  await cargarScript(b+"firebase-app-compat.js"); await cargarScript(b+"firebase-auth-compat.js"); await cargarScript(b+"firebase-firestore-compat.js");
  firebase.initializeApp(FIREBASE_CONFIG); fdb=firebase.firestore();
  let bajas=[];
  firebase.auth().onAuthStateChanged(async u=>{
    bajas.forEach(f=>f()); bajas=[]; UI.user=u; UI.ready=false; UI.role=null; Object.assign(S,{insts:{},eco:{},revs:{},users:{}});
    if(!u){ render(); pantallaLogin(); return; }
    const em=(u.email||"").toLowerCase();
    try{
      if(em===ADMIN_EMAIL.toLowerCase()) UI.role="admin";
      else { const d=await fdb.collection(COL.users).doc(em).get(); UI.role=d.exists?(d.data().rol==="admin"?"admin":"tecnico"):null; }
    }catch(e){ UI.role=null; }
    if(!UI.role){ render(); $("#app").innerHTML=`<div class="panel login"><h2>Sin acceso</h2><p class="sub">La cuenta ${esc(em)} no está autorizada. Pide al administrador que te dé acceso desde Ajustes.</p><button class="btn" data-act="salir">Entrar con otra cuenta</button></div>`; return; }
    const escuchar=col=>{ bajas.push(fdb.collection(COL[col]).onSnapshot(sn=>{ const o={}; sn.forEach(d=>o[d.id]=d.data()); S[col]=o; if(!$("#ov").classList.contains("on")) render(); }, e=>{ console.error(e); aviso("No se han podido leer los datos ("+col+"). Revisa la conexión.",true); })); };
    escuchar("insts"); escuchar("revs"); if(isAdmin()){ escuchar("eco"); escuchar("users"); }
    UI.ready=true; render();
  });
}
async function pantallaLogin(){
  $("#app").innerHTML=`<div class="panel login"><h2>Control de cámaras</h2><p class="sub">Entra con tu cuenta de Google autorizada.</p><div id="gbtn" style="display:flex;justify-content:center;margin-top:14px"></div></div>`;
  try{
    if(!window.google||!google.accounts) await cargarScript("https://accounts.google.com/gsi/client");
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:r=>firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential(r.credential)).catch(e=>aviso("No se ha podido iniciar sesión: "+e.message,true))});
    google.accounts.id.renderButton($("#gbtn"),{theme:"filled_blue",size:"large",text:"signin_with",locale:"es"});
  }catch(e){ aviso("No se ha podido cargar el botón de Google. Recarga la página.",true); }
}

if(UI.demo) iniciarDemo(); else iniciarFirebase().catch(e=>{ $("#app").innerHTML=`<div class="panel empty">No se ha podido conectar con la base de datos. Recarga la página.<br><span class="sub">${esc(e.message)}</span></div>`; });
</script>
